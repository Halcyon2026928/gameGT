plugins { id 'com.android.application' }

android {
    namespace 'com.example.lspempty'
    compileSdk 34
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.example.lspempty'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly files("${rootDir}/.build/xposed-api-82.jar")
}
